# Desenvolvimento: os arquivos são montados no container, então
# qualquer alteração aparece ao recarregar o navegador.
services:
  apex:
    image: nginx:1.27-alpine
    container_name: apex-dev
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
